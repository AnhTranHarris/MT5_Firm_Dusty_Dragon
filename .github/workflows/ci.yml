name: Dusty Dragon CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  constitutional-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check --diff .

      - name: Pytest
        run: pytest
