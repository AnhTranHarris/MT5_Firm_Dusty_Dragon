name: Dusty Dragon CI

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches:
      - main

jobs:
  constitutional-qc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: UI JavaScript syntax
        run: |
          node --check ui_lab/pc_command_center/performance-dashboard-v33.js
          node --check ui_lab/pc_command_center/performance-timeframe-v38.js
          node --check ui_lab/pc_command_center/performance-mock-history.js
          node --check ui_lab/pc_command_center/performance-scope-mock-v39.js
          node --check ui_lab/pc_command_center/performance-panel-sync-v39.js
          node --check ui_lab/pc_command_center/performance-quant-scope-mock-v40.js
          node --check ui_lab/pc_command_center/performance-quant-sync-v41.js
          node --check ui_lab/pc_command_center/animation-governor-v19.js

      - name: Performance read-model contract
        run: node ui_lab/pc_command_center/performance-contract-check.mjs
