name: UI Lab Pages Preview

on:
  push:
    branches:
      - dev/ui-lab-v1
    paths:
      - "ui_lab/pc_command_center/**"
      - ".github/workflows/ui-lab-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ui-lab-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout certified UI branch
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage PC Command Center only
        shell: bash
        run: |
          set -euo pipefail
          test -f ui_lab/pc_command_center/index.html
          rm -rf _site
          mkdir -p _site
          cp -a ui_lab/pc_command_center/. _site/
          touch _site/.nojekyll
          printf '%s\n' "${GITHUB_SHA}" > _site/DEPLOYED_COMMIT.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy UI Lab preview
        id: deployment
        uses: actions/deploy-pages@v4
