name: UI Lab Pages Preview

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-lab-pages.yml"
  workflow_dispatch:

# GitHub Pages production deployment intentionally runs from the repository's
# default/protected branch. Published content is read-only UI Lab checked out
# from dev/ui-lab-v1; backend, broker, MT5, credentials and execution code are
# never staged into the Pages artifact.
#
# Preview checkpoint: Command capital planning v3.3 + Trading Floor analytical
# hierarchy + Performance v4.4. Capital planning is UI-Lab simulated; realized
# gain recognition, milestone advancement and expectancy belong in Core.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "ui-lab-pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UI Lab branch
        uses: actions/checkout@v6
        with:
          ref: dev/ui-lab-v1

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Validate UI contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ui_lab/pc_command_center/hierarchy-data.js
          node --check ui_lab/pc_command_center/hierarchy-tree-density-v30.js
          node --check ui_lab/pc_command_center/capital-planning-mock-v33.js
          node --check ui_lab/pc_command_center/command-timeline-v32.js
          node --check ui_lab/pc_command_center/command-capital-milestones-v31.js
          node --check ui_lab/pc_command_center/performance-dashboard-v33.js
          node --check ui_lab/pc_command_center/performance-timeframe-v38.js
          node --check ui_lab/pc_command_center/performance-mock-history.js
          node --check ui_lab/pc_command_center/performance-scope-mock-v39.js
          node --check ui_lab/pc_command_center/performance-panel-sync-v39.js
          node --check ui_lab/pc_command_center/performance-quant-scope-mock-v40.js
          node --check ui_lab/pc_command_center/performance-quant-sync-v41.js
          node ui_lab/pc_command_center/performance-contract-check.mjs
          node ui_lab/pc_command_center/capital-planning-contract-check.mjs

      - name: Stage PC Command Center only
        shell: bash
        run: |
          set -euo pipefail
          test -f ui_lab/pc_command_center/index.html
          test -f ui_lab/pc_command_center/hierarchy-tree-density-v30.js
          test -f ui_lab/pc_command_center/hierarchy-tree-density-v30.css
          test -f ui_lab/pc_command_center/TRADING_FLOOR_WINDOWS_HANDOFF.md
          test -f ui_lab/pc_command_center/capital-planning-mock-v33.js
          test -f ui_lab/pc_command_center/command-timeline-v32.js
          test -f ui_lab/pc_command_center/command-timeline-v32.css
          test -f ui_lab/pc_command_center/command-capital-milestones-v31.js
          test -f ui_lab/pc_command_center/command-capital-milestones-v31.css
          test -f ui_lab/pc_command_center/COMMAND_CAPITAL_MILESTONES_WINDOWS_HANDOFF.md
          test -f ui_lab/pc_command_center/performance-dashboard-v33.js
          test -f ui_lab/pc_command_center/performance-dashboard-v30.css
          test -f ui_lab/pc_command_center/performance-quant-v32.css
          test -f ui_lab/pc_command_center/performance-timeframe-v38.js
          test -f ui_lab/pc_command_center/performance-timeframe-v36.css
          test -f ui_lab/pc_command_center/performance-layout-v36.css
          test -f ui_lab/pc_command_center/performance-scope-v38.css
          test -f ui_lab/pc_command_center/performance-panel-sync-v39.css
          test -f ui_lab/pc_command_center/performance-mock-history.js
          test -f ui_lab/pc_command_center/performance-scope-mock-v39.js
          test -f ui_lab/pc_command_center/performance-panel-sync-v39.js
          test -f ui_lab/pc_command_center/performance-quant-scope-mock-v40.js
          test -f ui_lab/pc_command_center/performance-quant-sync-v41.js
          test -f ui_lab/pc_command_center/PERFORMANCE_WINDOWS_HANDOFF.md
          test -f ui_lab/pc_command_center/PERFORMANCE_SCOPE_WINDOWS_HANDOFF.md
          rm -rf _site
          mkdir -p _site
          cp -a ui_lab/pc_command_center/. _site/
          touch _site/.nojekyll
          git -C . rev-parse HEAD > _site/DEPLOYED_COMMIT.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy UI Lab preview
        id: deployment
        uses: actions/deploy-pages@v4