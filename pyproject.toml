[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-firm-dusty-dragon"
version = "0.1.0"
description = "Paper-first MT5 autonomous trading research platform integrating forecasting, research, governance, and adaptive learning."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0"]
drive = [
  "google-api-python-client>=2.140,<3",
  "google-auth>=2.30,<3",
  "google-auth-oauthlib>=1.2,<2",
]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"src/dusty_dragon/research/task_graph.py" = ["I001"]

[tool.ruff.lint.isort]
known-first-party = ["dusty_dragon"]
